[workspace]
resolver = "2"

members = [
    "crates/runtime",
    "crates/runtime-daemon",
    "crates/agentctl",
    "crates/model-adapters",
    "crates/tool-adapters",
#    "sdk/python",
]

default-members = [
    "crates/runtime",
    "crates/runtime-daemon",
    "crates/agentctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Agent Runtime Team"]

[workspace.dependencies]
# =========================
# Async Runtime
# =========================
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "process",
    "sync",
    "time",
    "fs",
    "io-util",
] }

async-trait = "0.1"

# =========================
# Serialization
# =========================
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# =========================
# Error Handling
# =========================
thiserror = "2"
anyhow = "1"

# =========================
# Logging / Trace
# =========================
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
] }

# =========================
# REST API
# =========================
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = [
    "trace",
    "cors",
] }

# =========================
# HTTP Client
# =========================
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# =========================
# CLI
# =========================
clap = { version = "4", features = [
    "derive",
    "env",
] }

# =========================
# ID / Time
# =========================
uuid = { version = "1", features = [
    "v4",
    "serde",
] }

chrono = { version = "0.4", features = [
    "serde",
] }

# =========================
# Concurrent Data Structures
# =========================
dashmap = "6"

# =========================
# Linux / OS
# =========================
nix = { version = "0.30", features = [
    "process",
    "signal",
    "socket",
    "fs",
    "poll",
    "mman",
] }

libc = "0.2"

# =========================
# Database
# =========================
rusqlite = { version = "0.37", features = [
    "bundled",
] }

# =========================
# Hash / Context Dedup
# =========================
sha2 = "0.10"
hex = "0.4"

# =========================
# Metrics
# =========================
prometheus = "0.14"

# =========================
# Python SDK / Binding
# =========================
pyo3 = { version = "0.26", features = [
    "extension-module",
] }

# =========================
# Internal Workspace Crates
# =========================
agent-runtime = {
    path = "crates/runtime"
}

agent-model-adapters = {
    path = "crates/model-adapters"
}

agent-tool-adapters = {
    path = "crates/tool-adapters"
}


# ============================================================
# Build Profiles
# ============================================================

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true


# ============================================================
# Workspace Lints
# ============================================================

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"